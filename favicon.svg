<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Obsidian Cosmic Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Warm Amber Gold to Cyan Border Gradient -->
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#d97706" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radiant Gold Text Gradient -->
    <linearGradient id="vpGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Soft Ambient Starlight Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.8" flood-color="#fbbf24" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Cosmic Badge Background -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="6.5" fill="url(#bg)" stroke="url(#border)" stroke-width="1.5" />

  <!-- Celestial Constellation Starlight Accent (Upper Right) -->
  <circle cx="24.5" cy="7.5" r="1.2" fill="#38bdf8" opacity="0.95" />
  <line x1="24.5" y1="4.5" x2="24.5" y2="10.5" stroke="#38bdf8" stroke-width="0.7" opacity="0.75" />
  <line x1="21.5" y1="7.5" x2="27.5" y2="7.5" stroke="#38bdf8" stroke-width="0.7" opacity="0.75" />

  <!-- Brand Monogram "VP" in Amber Gold -->
  <text x="14.5" y="21.5" text-anchor="middle" font-family="'JetBrains Mono', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace, sans-serif" font-weight="900" font-size="14.5" letter-spacing="-0.5" fill="url(#vpGold)" filter="url(#goldGlow)">VP</text>
</svg>
